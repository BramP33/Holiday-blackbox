 # Default configuration for Holiday Blackbox

language: en

trip:
  name: My Trip
  begin_date: 2025-01-01
  end_date: 2025-12-31
  places: []

verify:
  default_mode: fast   # 'fast' or 'sha256'

power_off_screen: trip   # 'info' | 'trip' | 'clear'

ap:
  ssid: Blackbox
  password: vakantie
  channel: auto
  region: US

previews:
  enabled: true
  video_height: 480
  video_bitrate: 1200k
  max_cache_gb: 50

limits:
  min_free_gb: 10

transcription:
  enabled: true
  start_time: "22:00"
  end_time: "07:00"
  poll_seconds: 60
  whisper:
    model: tiny.en
    compute_type: int8
    device: cpu
    beam_size: 5
    temperature: 0.0
    vad_filter: false
  keywords:
    method: frequency   # 'frequency' or 'sentence-transformer'
    top_k: 12
    max_candidates: 256
  semantic:
    enabled: true
    model: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
    device: cpu
    min_similarity: 0.25

network:
  # 'ap' to create hotspot, 'wifi' to join known WiFi
  mode: ap

web:
  host: 0.0.0.0
  port: 8080
  page_size: 50
  upload_device_label: Uploads
  upload_max_mb: 8192

paths:
  # Path where NVMe is mounted; a 'Blackbox' folder is created inside.
  nvme_mount: /mnt/nvme
  # Source mount roots to scan for DCIM (first found is used for manual backup)
  source_roots:
    - /media
    - /run/media
    - /mnt
    - /Volumes
  # Where proxies/thumbnails are stored (under the Blackbox folder by default)
  proxies_subdir: proxies


device_labels:
  gopro: Gopro
  drone: Drone
  "360": "360"
  lumix_g7: Lumix G7
  camera: Camera

hardware:
  display: epd2in7_v2
  orientation: landscape
  buttons:
    # GPIO BCM numbers, top->bottom. Internal pull-ups, active-low.
    - 5
    - 6
    - 13
    - 19
