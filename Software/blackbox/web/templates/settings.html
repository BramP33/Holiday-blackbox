{% extends 'base.html' %}
{% block content %}
  <h2 class="page-title">{{ t('web.settings.title') }}</h2>
  <form class="form" method="post">
    <fieldset>
      <legend>{{ t('web.settings.trip') }}</legend>
      <label> {{ t('web.settings.trip_name') }}
        <input name="trip.name" value="{{cfg['trip']['name']}}" />
      </label>
      <label> {{ t('web.settings.trip_begin') }}
        <input name="trip.begin_date" value="{{cfg['trip']['begin_date']}}" />
      </label>
      <label> {{ t('web.settings.trip_end') }}
        <input name="trip.end_date" value="{{cfg['trip']['end_date']}}" />
      </label>
      <label> {{ t('web.settings.trip_places') }}
        <input name="trip.places" value="{{ (cfg['trip'].get('places') or []) | join(', ') }}" />
      </label>
    </fieldset>
    <fieldset>
      <legend>{{ t('web.settings.verify') }}</legend>
      <label> {{ t('web.settings.verify_mode') }}
        <select name="verify.default_mode">
          <option value="fast" {% if cfg['verify']['default_mode']=='fast' %}selected{% endif %}>{{ t('settings.values.fast') }}</option>
          <option value="sha256" {% if cfg['verify']['default_mode']=='sha256' %}selected{% endif %}>{{ t('settings.values.sha256') }}</option>
        </select>
      </label>
    </fieldset>
    <fieldset>
      <legend>{{ t('web.settings.ap') }}</legend>
      <label> {{ t('web.settings.ap_ssid') }}
        <input name="ap.ssid" value="{{cfg['ap']['ssid']}}" />
      </label>
      <label> {{ t('web.settings.ap_password') }}
        <input name="ap.password" value="{{cfg['ap']['password']}}" />
      </label>
    </fieldset>
    <fieldset>
      <legend>{{ t('web.settings.web') }}</legend>
      <label> {{ t('web.settings.web_page_size') }}
        <input name="web.page_size" value="{{cfg['web']['page_size']}}" size="4" />
      </label>
    </fieldset>
    <fieldset>
      <legend>{{ t('web.settings.proxies') }}</legend>
      <label> {{ t('web.settings.proxies_max_cache') }}
        <input name="previews.max_cache_gb" value="{{cfg['previews']['max_cache_gb']}}" size="4" />
      </label>
    </fieldset>
    <fieldset>
      <legend>{{ t('web.settings.title') }}</legend>
      <label> {{ t('web.settings.language') }}
        <select name="language">
          <option value="en" {% if cfg['language']=='en' %}selected{% endif %}>{{ t('settings.values.lang_en') }}</option>
          <option value="nl" {% if cfg['language']=='nl' %}selected{% endif %}>{{ t('settings.values.lang_nl') }}</option>
        </select>
      </label>
    </fieldset>
    <div class="form-actions">
      <button class="btn" type="submit">{{ t('web.settings.save') }}</button>
    </div>
  </form>
{% endblock %}
