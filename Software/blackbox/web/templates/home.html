{% extends 'base.html' %}
{% block content %}
  <section class="hero">
    <div class="hero-inner">
      <h1>{{ t('web.home.welcome_title') }}</h1>
      <div class="potd">
        <div class="camp-frame">
          {% if potd_url %}
            <a class="thumb" href="{{ potd_download }}">
              <img src="{{ potd_url }}" alt="{{ t('web.home.potd') }}" loading="lazy" />
            </a>
          {% else %}
            <div class="thumb placeholder">
              <img src="{{ url_for('static', filename='placeholder_photo.svg') }}" alt="{{ t('web.home.no_photos_alt') }}" />
            </div>
          {% endif %}
        </div>
      </div>
    </div>
  </section>

  <section class="feature">
    <h3 class="section-title">{{ t('web.home.camping_fact') }}</h3>
    <p class="fact">{{ camping_fact }}</p>
  </section>
{% endblock %}
