name: blackbox_flutter
description: Touch-first interface for the Blackbox device
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  flutter_riverpod: ^2.4.5
  go_router: ^13.1.0
  intl: ^0.20.2
  web_socket_channel: ^2.4.0
  connectivity_plus: ^5.0.2
  cached_network_image: ^3.3.1
  video_player: ^2.8.6
  url_launcher: ^6.2.5
  flutter_svg: ^2.0.9
  process: ^5.0.2
  video_player_media_kit: ^1.0.5
  media_kit_libs_linux: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/visuals/
    - assets/branding/
    - assets/textures/
    - assets/icons/
    - assets/data/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-VariableFont_opsz,wght.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter-VariableFont_opsz,wght.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-VariableFont_opsz,wght.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter-Italic-VariableFont_opsz,wght.ttf
          weight: 400
          style: italic
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald/Oswald-VariableFont_wght.ttf
          weight: 400
        - asset: assets/fonts/Oswald/Oswald-VariableFont_wght.ttf
          weight: 500
        - asset: assets/fonts/Oswald/Oswald-VariableFont_wght.ttf
          weight: 600
    - family: SpectralSC
      fonts:
        - asset: assets/fonts/Spectral_SC/SpectralSC-Regular.ttf
          weight: 400
        - asset: assets/fonts/Spectral_SC/SpectralSC-SemiBold.ttf
          weight: 600

dependency_overrides:
  wakelock_plus:
    path: packages/wakelock_plus_stub
